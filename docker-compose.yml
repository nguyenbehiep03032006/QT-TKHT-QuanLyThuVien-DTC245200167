version: '3.8'

services:
  db:
    image: postgres:15
    container_name: library_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: library_db
    networks:
      - internal_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: library_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thuvien.com
      PGADMIN_DEFAULT_PASSWORD: StrongPassword123!
    ports:
      - "5050:80"
    networks:
      - internal_network
      - web_network

  backend:
    build: ./app
    container_name: library_app
    restart: always
    depends_on:
      - db
    networks:
      - internal_network
      - web_network

  nginx:
    image: nginx:latest
    container_name: library_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - web_network

networks:
  internal_network:
    internal: true
  web_network:
